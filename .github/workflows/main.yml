name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 1.5 Quick Set Taiwan Locale & Timezone
        run: |
          Write-Host "正在切換系統區域與時區為台灣..."
          Set-Culture zh-TW
          Set-WinSystemLocale -SystemLocale zh-TW
          Set-WinHomeLocation -GeoId 237
          Set-TimeZone -Id "Taipei Standard Time"
          Write-Host "設定完成！"

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Hoya-1104+" -AsPlainText -Force
          New-LocalUser -Name "freelin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "freelin" -ErrorAction SilentlyContinue
          net user runneradmin Hoya-1104+

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "正在下載 Tailscale 安裝包..."
          Invoke-WebRequest "https://tailscale.com" -OutFile "C:\tailscale.msi"
          
          Write-Host "正在進行背景靜態安裝，請稍候..."
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
          # 🔄 修正：強制等待直到 tailscale.exe 檔案確實出現才繼續（最多等 60 秒）
          $exePath = "C:\Program Files\Tailscale\tailscale.exe"
          $retry = 0
          while (!(Test-Path $exePath) -and $retry -lt 12) {
              Write-Host "等待 Tailscale 安裝釋出組件... ($($retry * 5)秒)"
              Start-Sleep -Seconds 5
              $retry++
          }

          if (!(Test-Path $exePath)) {
              Write-Error "Tailscale 安裝失敗，找不到主程式！"
              exit 1
          }

          Write-Host "Tailscale 安裝成功，正在啟動連線..."
          # 啟動並加入您的 Tailscale 網路
          & $exePath up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 5

          # 取得 Tailscale IP
          $ts_ip = & $exePath ip -4

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : freelin" -ForegroundColor Yellow
          Write-Host "  Password     : Hoya-1104+" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      - name: 4. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/2880] Server running..."
          }
