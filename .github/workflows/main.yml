name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 1.5 Force Install Full Taiwan Language Pack
        run: |
          Write-Host ">>> 開始強制安裝完整繁體中文(台灣)語言包... <<<"
          # 強制啟動 Windows 語言下載背景服務
          Set-Service -Name wuauserv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name wuauserv -ErrorAction SilentlyContinue
          
          # 使用強效語系命令（不帶無法識別的引數），並允許自動下載
          Add-LanguageLanguageListEntry -LanguageId zh-TW -Force -ErrorAction SilentlyContinue
          Set-Culture zh-TW
          Set-WinSystemLocale -SystemLocale zh-TW
          Set-WinUILanguageOverride -Language zh-TW
          Set-WinHomeLocation -GeoId 237
          Set-TimeZone -Id "Taipei Standard Time"
          
          Write-Host "設定完成！請注意：初次登入時可能需要等背景套用約 1-2 分鐘。"

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Hoya-1104+" -AsPlainText -Force
          New-LocalUser -Name "freelin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "freelin" -ErrorAction SilentlyContinue
          net user runneradmin Hoya-1104+

      - name: 3. Install & Connect Tailscale VPN via Choco
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host ">>> 使用 Choco 部署免外掛 Tailscale 綠色套件... <<<"
          choco install tailscale -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          Write-Host "正在嘗試啟動 Tailscale 連線..."
          & tailscale up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 5
          $ts_ip = & tailscale ip -4

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : freelin" -ForegroundColor Yellow
          Write-Host "  Password     : Hoya-1104+" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      - name: 4. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/2880] Server running..."
          }
