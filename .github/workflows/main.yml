name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 1.5 Set Taiwan Region and Locale (DISM Method)
        run: |
          Write-Host "正在設定系統底層區域為台灣格式..."
          # 使用所有 Windows Server 都支援的標準指令，設定區域與時區
          Set-Culture zh-TW
          Set-WinSystemLocale -SystemLocale zh-TW
          Set-WinHomeLocation -GeoId 237
          Set-TimeZone -Id "Taipei Standard Time"
          
          # 使用 DISM 修改系統預設語系（防亂碼）
          dism /online /Set-intl:zh-TW /Quiet
          Write-Host "底層語系設定完成！"

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Hoya-1104+" -AsPlainText -Force
          New-LocalUser -Name "freelin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "freelin" -ErrorAction SilentlyContinue
          net user runneradmin Hoya-1104+

      - name: 3. Install & Connect Tailscale VPN via Choco
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host ">>> 使用 Choco 部署免外掛 Tailscale 綠色套件... <<<"
          choco install tailscale -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          Write-Host "正在嘗試啟動 Tailscale 連線..."
          & tailscale up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 5
          $ts_ip = & tailscale ip -4

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : freelin" -ForegroundColor Yellow
          Write-Host "  Password     : Hoya-1104+" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      - name: 4. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/2880] Server running..."
          }
