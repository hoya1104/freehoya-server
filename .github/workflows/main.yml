name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 1.5 Set OS Language to zh-TW (Taiwan) & Timezone
        run: |
          Write-Host "正在下載並安裝繁體中文(台灣)語言包..."
          # 安裝 zh-TW 語言包並將其同步應用到全域設定
          Install-Language -Language zh-TW -CopyToSettings -Force
          
          Write-Host "正在修改區域設定與系統語系..."
          # 修改地區格式為台灣、系統語系(非Unicode)為台灣，並修改時區為台北
          Set-Culture zh-TW
          Set-WinSystemLocale -SystemLocale zh-TW
          Set-WinUILanguageOverride -Language zh-TW
          Set-WinHomeLocation -GeoId 237
          Set-TimeZone -Id "Taipei Standard Time"
          
          Write-Host "語系已成功切換為繁體中文(台灣)！"

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Hoya-1104+" -AsPlainText -Force
          New-LocalUser -Name "freelin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "freelin" -ErrorAction SilentlyContinue
          net user runneradmin Hoya-1104+

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # Download and install Tailscale silently
          Invoke-WebRequest "https://tailscale.com" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          # Connect to Tailscale network
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"

          Start-Sleep -Seconds 8

          # Get Tailscale IP
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : freelin" -ForegroundColor Yellow
          Write-Host "  Password     : Hoya-1104+" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      - name: 4. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/2880] Server running..."
          }
